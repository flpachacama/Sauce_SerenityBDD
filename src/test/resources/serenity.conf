webdriver {
  driver = "chrome"
  base.url = "https://www.saucedemo.com"
  capabilities {
    "goog:chromeOptions" {
      args = ["--start-maximized", "--disable-notifications"]
    }
  }
}

serenity {
  project.name = "SauceDemo E2E con Serenity Screenplay"
  take.screenshots = FOR_EACH_ACTION
  logging = VERBOSE
}
